name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

jobs:
  guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Lapis 1: cek tabrakan timestamp + DROP tanpa SAFE + header kontrak.
      # (Snapshot vs DB dilewati di CI karena butuh token/DB; jalankan
      #  scripts/snapshot_functions.sh lokal sebelum commit.)
      - name: Guard migrasi (timestamp unik, DROP/ALTER selamat)
        run: bash scripts/check_migrations.sh --all


      # Boundary layar: screen DILARANG import services/ (pakai provider).
      - name: Guard boundary screen (larangan import services/)
        run: bash scripts/check_screen_boundary.sh

      # Lapis 4: larangan tipografi (AGENTS.md) — hanya ANGKA literal yang
      # dilarang; nilai dari token resmi (AppText/AppGlyph/StoryText) sah.
      - name: Guard tipografi (fontSize numerik + height manual di luar config)
        run: |
          hits=$(grep -rnE 'fontSize: *[0-9]' lib --include='*.dart' --exclude-dir=config | wc -l)
          echo "fontSize numerik (angka literal) di luar lib/config: $hits"
          if [ "$hits" -ne 0 ]; then
            grep -rnE 'fontSize: *[0-9]' lib --include='*.dart' --exclude-dir=config | head -20
            exit 1
          fi

          hits=$(grep -rn 'height: 1\.' lib --include='*.dart' --exclude-dir=config | wc -l)
          echo "height manual (1.x) di luar lib/config: $hits"
          if [ "$hits" -ne 0 ]; then
            grep -rn 'height: 1\.' lib --include='*.dart' --exclude-dir=config | head -20
            exit 1
          fi

  analyze-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze (gagal saat error/warning, info dilewati)
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Test
        run: flutter test --coverage --no-pub

      - name: Coverage gate (ratchet anti-regresi)
        # Ratchet dinaikkan 2026-09-20 setelah menambah test mixin/SQL/auth/
        # io-service. Angka = sedikit di bawah hasil ukur nyata (margin anti
        # fluktuasi), bukan target akhir. Terukur saat itu:
        #   providers 26.3% · services 16.3% · models 78.2% · mixins 15.5%
        # Naikkan bertahap tiap ada PR yang menambah test.
        run: |
          python3 - <<'PY'
          import os, sys
          path = 'coverage/lcov.info'
          if not os.path.exists(path):
              print('coverage/lcov.info tidak ada'); sys.exit(1)
          stats = {}
          cur = None
          for line in open(path, encoding='utf-8', errors='ignore'):
              line = line.strip()
              if line.startswith('SF:'):
                  cur = line[3:]
              elif line.startswith('DA:'):
                  try:
                      hit = int(line[3:].split(',')[1])
                  except Exception:
                      continue
                  key = 'other'
                  for d in ('lib/providers/', 'lib/services/', 'lib/models/', 'lib/mixins/'):
                      if cur and cur.endswith('.dart') and d in cur.replace('\\', '/'):
                          key = d; break
                  f, h = stats.get(key, (0, 0))
                  stats[key] = (f + 1, h + (1 if hit > 0 else 0))
              elif line == 'end_of_record':
                  cur = None
          minimum = {
              'lib/providers/': 25.0,
              'lib/services/': 15.0,
              'lib/models/': 75.0,
              'lib/mixins/': 14.0,
          }
          ok = True
          for d, floor in minimum.items():
              f, h = stats.get(d, (0, 0))
              pct = (100.0 * h / f) if f else 100.0
              print(f'{d}: {h}/{f} ({pct:.1f}%) vs min {floor}%')
              if pct < floor:
                  print(f'  -> REGRESI coverage di {d}'); ok = False
          sys.exit(0 if ok else 1)
          PY

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # SCA ringan: OSV scan untuk pubspec.lock + outdated report.
      - name: OSV scan (pubspec.lock)
        uses: google/osv-scanner-action@v2
        with:
          scan-args: ./pubspec.lock
        continue-on-error: true

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Pub outdated (laporan, tidak menggagalkan)
        run: flutter pub outdated || true

  sql-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Hanya jalan bila secret tersedia (fork tanpa secret => skip lembut).
    if: ${{ vars.SUPABASE_PROJECT_REF != '' && secrets.SUPABASE_ACCESS_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: SQL tests via Management API (transaksional)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: bash scripts/run_sql_tests.sh

  edge-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Deno test (helper edge murni + kontrak + auth)
        run: deno test --allow-read --allow-env supabase/functions/_shared/
