name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze (gagal saat error/warning, info dilewati)
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Test
        run: flutter test --no-pub
