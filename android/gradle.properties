org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Ketahanan jaringan Gradle — plugin facebook_app_events memakai versi dinamis
# `[18.0,19.0)` yang harus resolve dari Maven tiap build. Tanpa timeout/retry
# ini, resolve yang lambat bikin error "Repository MavenRepo is disabled due
# to earlier error" (build gagal, padahal cuma jaringan).
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.retries=5
systemProp.org.gradle.internal.repository.initial.backoff=500
# Pengoptimal resource R8 (resources.arsc compression) — menjawab rekomendasi
# Play Console "Penyingkatan resource yang dioptimalkan tidak diaktifkan".
android.enableResourceOptimizations=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
